<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Panel Kontrol Mesin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body class="container mt-5">

<h3 class="mb-4">Simulasi Panel Kontrol Mesin</h3>

<div id="cardMesin" class="card">

<div class="card-header bg-dark text-white">
Panel Kontrol Mesin-01
</div>

<div class="card-body text-center">

<!-- indikator status -->
<div id="statusIndicator" class="alert alert-secondary">
Status: <strong>UNKNOWN</strong>
</div>

<h2 id="suhuMesin">25 °C</h2>
<p>Suhu Operasional Saat Ini</p>

<button id="btnStart" class="btn btn-success">START</button>
<button id="btnStop" class="btn btn-danger" disabled>STOP</button>
<button id="btnReset" class="btn btn-warning">RESET</button>
<button id="btnMaint" class="btn btn-secondary">Maintenance Mode</button>

<hr>

<label>Set Target RPM</label>

<input type="number" id="inputRPM" class="form-control" placeholder="Max 2000">

<small id="errorRPM" class="text-danger d-none">
RPM melebihi batas aman
</small>

</div>
</div>

<!-- ============================= -->
<!-- Kalkulator Tagihan Listrik -->
<!-- ============================= -->

<hr class="mt-5">

<h4>Kalkulator Tagihan Listrik</h4>

<div class="mt-3">

<label>Daya (Watt)</label>
<input type="number" id="daya" class="form-control" placeholder="contoh: 500">

<label class="mt-2">Jam Pemakaian</label>
<input type="number" id="jam" class="form-control" placeholder="contoh: 10">

<h3 class="mt-3" id="hasilKwh">Total kWh : 0</h3>
<h3 id="hasilBiaya">Estimasi Biaya : Rp 0</h3>

</div>

<script src="script.js"></script>

</body>
</html>
