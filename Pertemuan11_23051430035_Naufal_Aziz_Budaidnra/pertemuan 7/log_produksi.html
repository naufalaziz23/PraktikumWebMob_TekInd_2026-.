<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Produksi Harian</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div class="row">
<!-- Kolom Kiri: Form Input -->
<div class="col-md-4">
<div class="card">
<div class="card-header">Input Data</div>
<div class="card-body">
<form id="formProduksi">
<div class="mb-3">
<label>Tanggal</label>
<input type="date" id="tanggal" class="form-control" required>
</div>
<div class="mb-3">
<label>Nama Operator</label>
<input type="text" id="operator" class="form-control" placeholder="Nama Lengkap" required>
</div>
<div class="mb-3">
<label>Shift</label>
<select id="shift" class="form-select" required>
<option value="Pagi">Pagi</option>
<option value="Siang">Siang</option>
<option value="Malam">Malam</option>
</select>
</div>
<div class="mb-3">
<label>Jumlah Produksi (Unit)</label>
<input type="number" id="jumlah" class="form-control" min="1" required>
</div>
<button type="submit" class="btn btn-primary w-100">Simpan Log</button>
<button type="button" id="btnHapusSemua" class="btn btn-danger
w-100 mt-2">Hapus Semua Data</button>
</form>
</div>
</div>
</div>
<!-- Kolom Kanan: Tabel Data -->
<div class="col-md-8">
<h3>Riwayat Produksi</h3>
<div class="row mb-3">
  <div class="col-md-8">
    <input type="text" id="searchOperator" class="form-control" placeholder="Search Operator Name...">
  </div>
  <div class="col-md-4 text-end">
    <button id="btnSort" class="btn btn-secondary w-100">Sort by Amount (Largest)</button>
  </div>
</div>
<table class="table table-bordered table-striped">
<thead class="table-dark">
<tr>
<th>Tanggal</th>
<th>Operator</th>
<th>Shift</th>
<th>Jumlah</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="tabelBody">
<!-- Data akan masuk di sini lewat JS -->
</tbody>
</table>
</div>
</div>

<hr class="my-5">

<!-- Mini-Project: 5S Audit Checklist -->
<h2 class="text-center mb-4">Aplikasi Checklist Audit 5S</h2>
<div class="row mb-5">
  <!-- Kolom Kiri: Form 5S -->
  <div class="col-md-4">
    <div class="card">
      <div class="card-header bg-success text-white">Input Audit 5S</div>
      <div class="card-body">
        <form id="form5S">
          <div class="mb-3">
            <label>Nama Auditor</label>
            <input type="text" id="auditorName" class="form-control" placeholder="Nama Lengkap" required>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="checkSeiri">
            <label class="form-check-label">Seiri (Ringkas)</label>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="checkSeiton">
            <label class="form-check-label">Seiton (Rapi)</label>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="checkSeiso">
            <label class="form-check-label">Seiso (Resik)</label>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="checkSeiketsu">
            <label class="form-check-label">Seiketsu (Rawat)</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="checkShitsuke">
            <label class="form-check-label">Shitsuke (Rajin)</label>
          </div>
          <button type="submit" class="btn btn-success w-100">Simpan Audit</button>
          <button type="button" id="btnHapusSemua5S" class="btn btn-outline-danger w-100 mt-2">Hapus Semua Audit</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Kolom Kanan: Tabel 5S -->
  <div class="col-md-8">
    <h3>Riwayat Audit 5S</h3>
    <table class="table table-bordered table-striped">
      <thead class="table-success">
        <tr>
          <th>Tanggal</th>
          <th>Auditor</th>
          <th>Skor</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tabelBody5S">
        <!-- Data 5S akan masuk di sini -->
      </tbody>
    </table>
  </div>
</div>

<script src="script_log.js"></script>
</body>
</html>
